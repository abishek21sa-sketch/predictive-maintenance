[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-intelligence"
version = "1.0.0"
description = "Enterprise predictive-maintenance decision intelligence with benchmark and real operational data workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<0.142",
  "starlette>=0.46,<1.0",
  "uvicorn[standard]>=0.30,<0.53",
  "numpy>=1.26,<2.5",
  "pandas>=2.2,<3.1",
  "scipy>=1.13,<1.19",
  "scikit-learn>=1.5,<1.10",
  "joblib>=1.4,<1.6",
  "pydantic>=2.8,<3.0",
  "SQLAlchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<8", "httpx>=0.27,<0.29", "ruff>=0.6,<0.17"]
gurobi = ["gurobipy>=12.0,<14"]
parquet = ["pyarrow>=16.0,<24"]
managed = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
pdm-intelligence = "pdm_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.package-data]
pdm_intelligence = ["frontend/*.html", "frontend/*.css", "frontend/*.js", "release/*.json", "release/*.joblib"]
