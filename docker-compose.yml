services:
  platform:
    build: .
    ports: ["8001:8000"]
    environment:
      PDM_RANDOM_SEED: "42"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
