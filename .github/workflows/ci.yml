name: CI
on: [push, pull_request]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m compileall -q src tests scripts
      - run: python -m pytest -W error --cov=pdm_intelligence --cov-report=term-missing
      - run: python scripts/v1_diagnostics.py
      - run: python scripts/v1_benchmark.py
      - run: python scripts/package_release.py --output dist/Predictive_Maintenance_Intelligence_Final.zip
      - run: python scripts/clean_extract_validate.py --archive dist/Predictive_Maintenance_Intelligence_Final.zip
      - run: python scripts/validate_production_manifest.py
      - run: python scripts/release_audit.py
      - run: python scripts/release_consistency.py
      - run: python scripts/enterprise_acceptance.py --run-tests
      - run: python -m pip wheel . --no-deps -w dist-ci
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.managed.yml --env-file .env.managed.example config --quiet
